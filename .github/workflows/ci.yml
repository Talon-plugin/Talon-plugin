name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_check:
    name: Build & Verify
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify Python Syntax
        run: |
          python3 -m py_compile plugin/extractor.py

      - name: Build Talons Plugin
        run: |
          chmod +x scripts/*.sh plugin/*.sh plugin/*.py
          ./scripts/make.sh

      - name: Verify Build Artifact Exists
        run: |
          if [ ! -f "build/talons.gda" ]; then
            echo "❌ Error: build/talons.gda not found"
            exit 1
          fi
          echo "✅ Build verified successfully!"
